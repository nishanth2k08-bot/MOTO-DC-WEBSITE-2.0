<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="pistonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3157" />
      <stop offset="100%" stop-color="#c9183b" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#8a94a6" />
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect width="64" height="64" rx="16" fill="#0d1016" stroke="#252b36" stroke-width="1.5" />
  
  <!-- Outer Glow Hexagon / Circle -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="rgba(255, 49, 87, 0.25)" stroke-width="2" />
  
  <!-- Piston Crown & Body -->
  <path d="M19 14 h26 a3 3 0 0 1 3 3 v15 a2 2 0 0 1 -2 2 h-4 v6 a2 2 0 0 1 -2 2 h-16 a2 2 0 0 1 -2 -2 v-6 h-4 a2 2 0 0 1 -2 -2 v-15 a3 3 0 0 1 3 -3 z" fill="url(#metalGrad)" />
  
  <!-- Compression Rings (Red grooves) -->
  <line x1="18" y1="18" x2="46" y2="18" stroke="#ff3157" stroke-width="2" />
  <line x1="18" y1="23" x2="46" y2="23" stroke="#ff3157" stroke-width="2" />
  <line x1="18" y1="28" x2="46" y2="28" stroke="#ff3157" stroke-width="2" />
  
  <!-- Gudgeon Pin Center Hole -->
  <circle cx="32" cy="27" r="4.5" fill="#0d1016" stroke="#ff3157" stroke-width="2" />
  
  <!-- Connecting Rod -->
  <path d="M28 42 L26 51 a6 6 0 0 0 12 0 L36 42 Z" fill="url(#pistonGrad)" />
  <circle cx="32" cy="51" r="2.5" fill="#0d1016" />
  
