<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="badgeRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3157" />
      <stop offset="100%" stop-color="#b80c2f" />
    </linearGradient>
    <linearGradient id="silver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>
  <!-- Background Badge (Aerodynamic Shield) -->
  <rect width="64" height="64" rx="16" fill="#0d1016" stroke="#252b36" stroke-width="1.5" />
  
  <!-- Outer Shield Border -->
  <path d="M14 12 h36 a3 3 0 0 1 3 3 v18 c0 14 -17 21 -21 23 c-4 -2 -21 -9 -21 -23 v-18 a3 3 0 0 1 3 -3 z" fill="rgba(255, 49, 87, 0.08)" stroke="url(#badgeRed)" stroke-width="2.5" />
  
  <!-- Stylized Italic "M" & "DC" Monogram -->
  <!-- "M" in crisp white -->
  <path d="M19 37 L23 20 L27 28 L31 20 L35 37" fill="none" stroke="url(#silver)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- "DC" racing sub-badge in vibrant red -->
  <path d="M37 28 h6 a5 5 0 0 1 0 10 h-6 z" fill="none" stroke="#ff3157" stroke-width="3" stroke-linejoin="round" />
  
  <!-- Speed Dash lines -->
  <line x1="20" y1="43" x2="44" y2="43" stroke="#ff3157" stroke-width="2" stroke-linecap="round" />
</svg>
