<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="studioBg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#1e222d"/>
      <stop offset="55%" stop-color="#111318"/>
      <stop offset="100%" stop-color="#08090c"/>
    </radialGradient>
    <radialGradient id="floorSpot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
    <filter id="studioShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
    <linearGradient id="metalChrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="25%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="75%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="rotorSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a95a5"/>
      <stop offset="35%" stop-color="#4a5568"/>
      <stop offset="70%" stop-color="#9aa5b8"/>
      <stop offset="100%" stop-color="#2d3748"/>
    </linearGradient>
    
    <linearGradient id="body_sp-133" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="cap_sp-133" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  
  </defs>

  <!-- Studio Canvas -->
  <rect width="600" height="600" fill="url(#studioBg)"/>
  <ellipse cx="300" cy="515" rx="220" ry="32" fill="url(#floorSpot)"/>
  <ellipse cx="300" cy="515" rx="160" ry="18" fill="rgba(0,0,0,0.65)"/>

  <!-- Content -->
  
      <g filter="url(#studioShadow)">
        <!-- Cap -->
        <rect x="262" y="105" width="76" height="32" rx="5" fill="url(#cap_sp-133)"/>
        <line x1="272" y1="105" x2="272" y2="137" stroke="#000000" stroke-width="1.5" opacity="0.3"/><line x1="284" y1="105" x2="284" y2="137" stroke="#000000" stroke-width="1.5" opacity="0.3"/><line x1="296" y1="105" x2="296" y2="137" stroke="#000000" stroke-width="1.5" opacity="0.3"/><line x1="308" y1="105" x2="308" y2="137" stroke="#000000" stroke-width="1.5" opacity="0.3"/><line x1="320" y1="105" x2="320" y2="137" stroke="#000000" stroke-width="1.5" opacity="0.3"/>
        <!-- Bottle Neck & Shoulder -->
        <path d="M272 137 L272 165 L225 210 L225 490 Q225 502 237 502 L363 502 Q375 502 375 490 L375 210 L328 165 L328 137 Z" fill="url(#body_sp-133)"/>
        
        <!-- Handle for Jug -->
        <path d="M375 230 Q425 255 425 330 Q425 405 375 430" fill="none" stroke="url(#body_sp-133)" stroke-width="34" stroke-linecap="round"/>
        <path d="M375 244 Q410 268 410 330 Q410 392 375 416" fill="none" stroke="#0f172a" stroke-width="14" stroke-linecap="round"/>
        
        <!-- Front Label -->
        <rect x="238" y="215" width="124" height="268" rx="8" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
        <!-- Brand Header Banner -->
        <rect x="244" y="225" width="112" height="42" rx="4" fill="#ffffff"/>
        <text x="300" y="253" fill="#334155" font-family="Arial, sans-serif" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="1">Mobil 1</text>
        <!-- Product Name -->
        <text x="300" y="295" fill="#f8fafc" font-family="Arial, sans-serif" font-size="17" font-weight="900" text-anchor="middle">ESP FORMULA</text>
        <text x="300" y="315" fill="#94a3b8" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">EMISSION SYSTEM PROTECTION</text>
        <!-- Viscosity Pill -->
        
        <rect x="252" y="330" width="96" height="38" rx="6" fill="#334155"/>
        <text x="300" y="356" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="900" text-anchor="middle">5W-30</text>
        
        <!-- Tech Specifications -->
        <text x="300" y="398" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle">PREMIUM ENGINE PROTECTION</text>
        <text x="300" y="414" fill="#64748b" font-family="Arial, sans-serif" font-size="8" font-weight="700" text-anchor="middle">API SP / SN PLUS • ACEA A3/B4</text>
        <!-- Volume badge -->
        <rect x="275" y="440" width="50" height="24" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="300" y="456" fill="#f8fafc" font-family="Arial, sans-serif" font-size="12" font-weight="900" text-anchor="middle">4L</text>
      </g>
    

  <!-- Studio Watermark Tag -->
  <text x="32" y="568" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">MOTODC AUTHENTIC PART • MOBIL 1 • ESP FORMULA 5W-30</text>
</svg>