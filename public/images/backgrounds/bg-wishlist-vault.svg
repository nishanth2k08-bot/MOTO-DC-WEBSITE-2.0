<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="vaultAmbientDark" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#221220" />
      <stop offset="50%" stop-color="#0a0c12" />
      <stop offset="100%" stop-color="#030406" />
    </radialGradient>
    <radialGradient id="vaultAmbientLight" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fdf2f4" />
      <stop offset="50%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </radialGradient>

    <!-- Center Overhead Spotlight -->
    <radialGradient id="pedestalSpotlight" cx="50%" cy="65%" r="45%">
      <stop offset="0%" stop-color="rgba(255, 49, 87, 0.28)" />
      <stop offset="50%" stop-color="rgba(255, 49, 87, 0.06)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>

    <linearGradient id="pedestalGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.4)" />
      <stop offset="100%" stop-color="rgba(255, 49, 87, 0.1)" />
    </linearGradient>

    <filter id="heartGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .vault-bg { fill: url(#vaultAmbientDark); transition: fill 0.4s ease; }
    .vault-panel { fill: #0b0e14; stroke: #1e2430; stroke-width: 1.5; }
    .pedestal-ring { stroke: #ff3157; stroke-width: 2.5; fill: none; }

    @media (prefers-color-scheme: light) {
      .vault-bg { fill: url(#vaultAmbientLight); }
      .vault-panel { fill: #ffffff; stroke: #e2e8f0; }
      .pedestal-ring { stroke: #ff3157; }
    }
  </style>

  <!-- Ambient Backdrop -->
  <rect width="1920" height="1080" class="vault-bg" />

  <!-- Showcase Wall Baffles (Sleek Vertical Slats) -->
  <g opacity="0.35">
    <rect x="220" y="80" width="80" height="520" rx="8" class="vault-panel" />
    <rect x="340" y="80" width="80" height="520" rx="8" class="vault-panel" />
    <rect x="460" y="80" width="80" height="520" rx="8" class="vault-panel" />
    
    <rect x="1380" y="80" width="80" height="520" rx="8" class="vault-panel" />
    <rect x="1500" y="80" width="80" height="520" rx="8" class="vault-panel" />
    <rect x="1620" y="80" width="80" height="520" rx="8" class="vault-panel" />
  </g>

  <!-- Polished Showroom Floor Spotlight -->
  <ellipse cx="960" cy="780" rx="600" ry="200" fill="url(#pedestalSpotlight)" />

  <!-- The Elevated Collector's Trophy Pedestal -->
  <g transform="translate(960, 760)">
    <!-- Base Tier Ellipse -->
    <ellipse cx="0" cy="80" rx="340" ry="80" fill="#0d1119" stroke="#1f2736" stroke-width="2" />
    <ellipse cx="0" cy="40" rx="280" ry="65" fill="#131924" stroke="#ff3157" stroke-width="1.5" opacity="0.8" />
    
    <!-- Top Glass Plinth -->
    <ellipse cx="0" cy="0" rx="220" ry="50" fill="url(#pedestalGlass)" stroke="#ffffff" stroke-width="2" />
    
    <!-- Glowing Red Perimeter Track -->
    <ellipse cx="0" cy="0" rx="200" ry="44" class="pedestal-ring" stroke-dasharray="10 6" />
    <circle cx="-200" cy="0" r="5" fill="#ff3157" />
    <circle cx="200" cy="0" r="5" fill="#ff3157" />
    <circle cx="0" cy="44" r="5" fill="#ff3157" />
  </g>

  <!-- Floating Holographic Heart Emblem (Awaiting Wishlist Items) -->
  <g transform="translate(960, 520)" filter="url(#heartGlow)">
    <path d="M 0 -20 C -40 -70 -120 -50 -120 10 C -120 65 0 130 0 130 C 0 130 120 65 120 10 C 120 -50 40 -70 0 -20 Z" fill="rgba(255, 49, 87, 0.85)" />
    <path d="M 0 -15 C -35 -60 -105 -42 -105 10 C -105 58 0 115 0 115 C 0 115 105 58 105 10 C 105 -42 35 -60 0 -15 Z" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.9" />
    <circle cx="0" cy="25" r="8" fill="#ffffff" />
  </g>

  <!-- Concentric Aura Rings Radiating from Pedestal -->
  <g opacity="0.3">
    <ellipse cx="960" cy="760" rx="460" ry="110" stroke="#ff3157" stroke-width="1" stroke-dasharray="6 8" fill="none" />
    <ellipse cx="960" cy="760" rx="640" ry="150" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="4 10" fill="none" />
  </g>

  <!-- Vault Header Status -->
  <text x="960" y="930" text-anchor="middle" fill="#4a5568" font-family="'Sora', sans-serif" font-weight="700" font-size="12" letter-spacing="4">COLLECTOR'S VAULT // RESERVE YOUR DREAM BUILDS</text>
</svg>
