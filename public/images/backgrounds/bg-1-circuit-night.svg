<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="skyGlow" cx="50%" cy="15%" r="75%">
      <stop offset="0%" stop-color="#1c0f1c" />
      <stop offset="45%" stop-color="#090c13" />
      <stop offset="100%" stop-color="#040609" />
    </radialGradient>
    <linearGradient id="trackGrad" x1="0%" y1="100%" x2="100%" y2="20%">
      <stop offset="0%" stop-color="#090c12" />
      <stop offset="60%" stop-color="#141822" />
      <stop offset="100%" stop-color="#0a0d14" />
    </linearGradient>
    <linearGradient id="apexRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1a40" />
      <stop offset="100%" stop-color="#b3001f" />
    </linearGradient>
    <linearGradient id="speedStreak" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255, 49, 87, 0)" />
      <stop offset="60%" stop-color="rgba(255, 49, 87, 0.75)" />
      <stop offset="100%" stop-color="rgba(255, 120, 150, 0.95)" />
    </linearGradient>
    <filter id="glowBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky & Ambient Base -->
  <rect width="1920" height="1080" fill="url(#skyGlow)" />

  <!-- Track Surface Sweep -->
  <path d="M -100 1180 Q 750 920 1050 640 T 2050 320 L 2050 1180 Z" fill="url(#trackGrad)" />
  
  <!-- Outer Curb Border & Apex Curbing (Red & White Alternating Rumble Strips) -->
  <g opacity="0.85">
    <path d="M 680 950 L 710 938 L 725 944 L 695 956 Z" fill="url(#apexRed)" />
    <path d="M 725 944 L 755 932 L 770 938 L 740 950 Z" fill="#e2e8f0" />
    <path d="M 770 938 L 800 926 L 815 932 L 785 944 Z" fill="url(#apexRed)" />
    <path d="M 815 932 L 845 920 L 860 926 L 830 938 Z" fill="#e2e8f0" />
    <path d="M 860 926 L 890 914 L 905 920 L 875 932 Z" fill="url(#apexRed)" />
    <path d="M 905 920 L 935 908 L 950 914 L 920 926 Z" fill="#e2e8f0" />
    <path d="M 950 914 L 980 902 L 995 908 L 965 920 Z" fill="url(#apexRed)" />
    <path d="M 995 908 L 1025 896 L 1040 902 L 1010 914 Z" fill="#e2e8f0" />
    <path d="M 1040 902 L 1070 890 L 1085 896 L 1055 908 Z" fill="url(#apexRed)" />
    <path d="M 1085 896 L 1115 884 L 1130 890 L 1100 902 Z" fill="#e2e8f0" />
  </g>

  <!-- Glowing Track Edge Boundary Line -->
  <path d="M -50 1150 Q 750 900 1050 620 T 2050 300" stroke="#ff3157" stroke-width="4" fill="none" opacity="0.7" filter="url(#glowBlur)" />
  <path d="M -50 1150 Q 750 900 1050 620 T 2050 300" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.8" />

  <!-- Speed Racing Line (High-speed motion trail) -->
  <path d="M 200 1120 Q 850 860 1120 600 T 1980 260" stroke="url(#speedStreak)" stroke-width="7" fill="none" filter="url(#glowBlur)" />
  <path d="M 200 1120 Q 850 860 1120 600 T 1980 260" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.9" />

  <!-- Secondary Drift Spark Lines -->
  <path d="M 350 1140 Q 920 890 1160 630 T 2020 290" stroke="rgba(255, 49, 87, 0.4)" stroke-width="2" stroke-dasharray="16 8" fill="none" />
  
  <!-- Digital Telemetry Grid Overlay (Subtle) -->
  <g opacity="0.18">
    <line x1="200" y1="100" x2="200" y2="980" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="4 6" />
    <line x1="500" y1="100" x2="500" y2="980" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="4 6" />
    <line x1="800" y1="100" x2="800" y2="980" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="4 6" />
    <line x1="1100" y1="100" x2="1100" y2="980" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="4 6" />
    <line x1="1400" y1="100" x2="1400" y2="980" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="4 6" />
    <line x1="1700" y1="100" x2="1700" y2="980" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="4 6" />
    <line x1="100" y1="300" x2="1820" y2="300" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="4 6" />
    <line x1="100" y1="600" x2="1820" y2="600" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="4 6" />
    <line x1="100" y1="900" x2="1820" y2="900" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="4 6" />
  </g>

  <!-- Distance / Sector Markers -->
  <text x="750" y="870" fill="#ff3157" font-size="12" font-family="'Sora', sans-serif" font-weight="700" letter-spacing="3" opacity="0.7">SECTOR 2 // APEX SPEED 178 KM/H</text>
  <text x="1450" y="240" fill="#a0aec0" font-size="11" font-family="'Sora', sans-serif" font-weight="600" letter-spacing="2" opacity="0.5">DRS ZONE ENTRY ⯈</text>
</svg>
