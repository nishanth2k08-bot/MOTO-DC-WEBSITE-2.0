<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Drafting Paper Grid Pattern -->
    <pattern id="cadGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="0.8" />
      <circle cx="0" cy="0" r="1" fill="rgba(255, 49, 87, 0.2)" />
    </pattern>

    <pattern id="subGrid" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="url(#cadGrid)" />
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.2" />
    </pattern>

    <radialGradient id="cadAmbient" cx="45%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0e131d" />
      <stop offset="60%" stop-color="#080b11" />
      <stop offset="100%" stop-color="#040609" />
    </radialGradient>

    <filter id="cadGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark CAD Drafting Table Base -->
  <rect width="1920" height="1080" fill="url(#cadAmbient)" />
  <rect width="1920" height="1080" fill="url(#subGrid)" />

  <!-- Center-Right Exploded Brake Disc & Caliper Schematic -->
  <g transform="translate(1320, 540)" opacity="0.6">
    <!-- Outer Rotor Circle -->
    <circle cx="0" cy="0" r="320" stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="none" />
    <circle cx="0" cy="0" r="280" stroke="rgba(255,255,255,0.2)" stroke-width="1" stroke-dasharray="6 6" fill="none" />
    
    <!-- Rotor Friction Ring Inner -->
    <circle cx="0" cy="0" r="180" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" fill="none" />
    
    <!-- Center Hub & 5-Lug Pattern -->
    <circle cx="0" cy="0" r="90" stroke="#ff3157" stroke-width="2" fill="none" />
    <circle cx="0" cy="0" r="45" stroke="#ffffff" stroke-width="1.5" fill="none" />
    
    <!-- 5 Wheel Lugs -->
    <circle cx="0" cy="-65" r="9" stroke="#ff3157" stroke-width="2" fill="rgba(255,49,87,0.2)" />
    <circle cx="62" cy="-20" r="9" stroke="#ff3157" stroke-width="2" fill="rgba(255,49,87,0.2)" />
    <circle cx="38" cy="52" r="9" stroke="#ff3157" stroke-width="2" fill="rgba(255,49,87,0.2)" />
    <circle cx="-38" cy="52" r="9" stroke="#ff3157" stroke-width="2" fill="rgba(255,49,87,0.2)" />
    <circle cx="-62" cy="-20" r="9" stroke="#ff3157" stroke-width="2" fill="rgba(255,49,87,0.2)" />

    <!-- Directional Curved Cooling Vanes -->
    <path d="M 0,-180 Q 40,-230 60,-280" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" fill="none" />
    <path d="M 127,-127 Q 180,-140 220,-170" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" fill="none" />
    <path d="M 180,0 Q 230,40 280,60" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" fill="none" />
    <path d="M 127,127 Q 140,180 170,220" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" fill="none" />
    <path d="M 0,180 Q -40,230 -60,280" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" fill="none" />
    <path d="M -127,127 Q -180,140 -220,170" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" fill="none" />
    <path d="M -180,0 Q -230,-40 -280,-60" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" fill="none" />
    <path d="M -127,-127 Q -140,-180 -170,-220" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" fill="none" />

    <!-- Crosshair Center Lines -->
    <line x1="-360" y1="0" x2="360" y2="0" stroke="#ff3157" stroke-width="1.2" stroke-dasharray="12 4 2 4" />
    <line x1="0" y1="-360" x2="0" y2="360" stroke="#ff3157" stroke-width="1.2" stroke-dasharray="12 4 2 4" />

    <!-- Caliper Mounting Bracket Outline -->
    <path d="M -190,-240 L -290,-270 L -330,-120 L -240,-100 Z" stroke="#ff3157" stroke-width="2" fill="rgba(255,49,87,0.08)" />
    
    <!-- Dimension Callouts -->
    <text x="0" y="-335" text-anchor="middle" fill="#ffffff" font-size="11" font-family="monospace">Ø 320.00 mm (OUTER ROTOR)</text>
    <text x="0" y="-195" text-anchor="middle" fill="#ff3157" font-size="10" font-family="monospace">TOL ±0.015mm</text>
    <text x="350" y="10" fill="#a0aec0" font-size="11" font-family="monospace">RADIAL MOUNT // 108mm</text>
  </g>

  <!-- Left Side Technical Telemetry & Header Callouts -->
  <g opacity="0.45" transform="translate(100, 140)">
    <text x="0" y="0" fill="#ff3157" font-size="14" font-family="'Sora', sans-serif" font-weight="700" letter-spacing="4">SYSTEM // CAD-DWG-0894</text>
    <text x="0" y="24" fill="#718096" font-size="11" font-family="monospace">COMPONENT: 4-PISTON MONOBLOC CALIPER &amp; FLOATING ROTOR</text>
    <text x="0" y="44" fill="#718096" font-size="11" font-family="monospace">MATERIAL: HIGH-CARBON CAST IRON / 6061-T6 BILLET BELL</text>
    <line x1="0" y1="60" x2="420" y2="60" stroke="rgba(255, 49, 87, 0.4)" stroke-width="1" />
  </g>
</svg>
