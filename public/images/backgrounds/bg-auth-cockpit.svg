<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="cockpitSkyDark" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1f111d" />
      <stop offset="50%" stop-color="#0a0c12" />
      <stop offset="100%" stop-color="#040508" />
    </radialGradient>
    <radialGradient id="cockpitSkyLight" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#e8edf5" />
      <stop offset="50%" stop-color="#dce3ee" />
      <stop offset="100%" stop-color="#cdd6e3" />
    </radialGradient>

    <!-- Start Button Glow -->
    <radialGradient id="startButtonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff1a40" />
      <stop offset="65%" stop-color="#b80020" />
      <stop offset="100%" stop-color="#4a000d" />
    </radialGradient>
    <radialGradient id="startRingAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255, 49, 87, 0.45)" />
      <stop offset="70%" stop-color="rgba(255, 49, 87, 0.08)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>

    <!-- Digital Gauge Glow -->
    <linearGradient id="gaugeNeedle" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff3157" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <filter id="cockpitBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .theme-base { fill: url(#cockpitSkyDark); transition: fill 0.4s ease; }
    .cockpit-dash { fill: #0b0e14; stroke: #1e2430; stroke-width: 2; transition: all 0.4s ease; }
    .cockpit-trim { stroke: #ff3157; stroke-width: 2.5; opacity: 0.85; }
    .digital-gauge { stroke: rgba(255, 255, 255, 0.25); stroke-width: 2; fill: none; }
    .windshield-view { fill: #080a10; opacity: 0.9; transition: all 0.4s ease; }
    .subtle-lines { stroke: rgba(255, 255, 255, 0.08); stroke-width: 1; }
    .accent-text { fill: #ff3157; font-family: 'Sora', sans-serif; font-weight: 700; }
    .muted-text { fill: #718096; font-family: monospace; font-size: 11px; }

    @media (prefers-color-scheme: light) {
      .theme-base { fill: url(#cockpitSkyLight); }
      .cockpit-dash { fill: #f1f4f9; stroke: #cbd5e1; }
      .windshield-view { fill: #e2e8f0; opacity: 0.85; }
      .subtle-lines { stroke: rgba(0, 0, 0, 0.06); }
      .muted-text { fill: #64748b; }
    }
  </style>

  <!-- Sky / Windshield Panorama -->
  <rect width="1920" height="1080" class="theme-base" />

  <!-- Road vanishing in the windshield -->
  <path d="M 0 540 Q 960 480 1920 540 L 1920 0 L 0 0 Z" class="windshield-view" />
  <!-- Distant City/Mountain Horizon through glass -->
  <path d="M 300 460 Q 650 420 960 440 T 1620 450 L 1920 480 L 0 480 Z" fill="#040608" opacity="0.4" />
  
  <!-- Curved Windshield Pillar A-Frames (Left and Right) -->
  <path d="M 0 0 L 160 0 L 380 540 L 0 680 Z" class="cockpit-dash" />
  <path d="M 1920 0 L 1760 0 L 1540 540 L 1920 680 Z" class="cockpit-dash" />

  <!-- Main Sweeping Dashboard Cowl -->
  <path d="M 0 680 Q 960 490 1920 680 L 1920 1080 L 0 1080 Z" class="cockpit-dash" />
  <path d="M 0 680 Q 960 490 1920 680" class="cockpit-trim" />

  <!-- Crimson Ambient Dash Lighting Crease -->
  <path d="M 280 720 Q 960 550 1640 720" stroke="#ff3157" stroke-width="4" fill="none" opacity="0.6" filter="url(#cockpitBlur)" />
  <path d="M 280 720 Q 960 550 1640 720" stroke="#ffffff" stroke-width="1" fill="none" opacity="0.8" />

  <!-- Center Console: ENGINE START / STOP Button (Focal Point) -->
  <g transform="translate(960, 840)">
    <!-- Outer Heat Shield Rim -->
    <circle cx="0" cy="0" r="85" fill="url(#startRingAura)" />
    <circle cx="0" cy="0" r="62" fill="#141822" stroke="#2d3748" stroke-width="3" />
    <circle cx="0" cy="0" r="50" fill="url(#startButtonGlow)" stroke="#ff4d6d" stroke-width="2" filter="url(#cockpitBlur)" />
    <circle cx="0" cy="0" r="48" fill="url(#startButtonGlow)" />
    <!-- Start Button Label -->
    <text x="0" y="-12" text-anchor="middle" fill="#ffffff" font-size="10" font-family="'Sora', sans-serif" font-weight="800" letter-spacing="2">ENGINE</text>
    <text x="0" y="6" text-anchor="middle" fill="#ffffff" font-size="13" font-family="'Sora', sans-serif" font-weight="800" letter-spacing="3">START</text>
    <text x="0" y="20" text-anchor="middle" fill="#ffffff" font-size="9" font-family="'Sora', sans-serif" font-weight="700" letter-spacing="2" opacity="0.85">STOP</text>
  </g>

  <!-- Left Side: Digital Instrument Cluster (RPM Tachometer Arc) -->
  <g transform="translate(480, 720)">
    <path d="M -160 80 A 180 180 0 0 1 120 -80" class="digital-gauge" />
    <path d="M -160 80 A 180 180 0 0 1 60 -50" stroke="#ff3157" stroke-width="4" fill="none" filter="url(#cockpitBlur)" />
    <path d="M -160 80 A 180 180 0 0 1 60 -50" stroke="#ffffff" stroke-width="2" fill="none" />
    <line x1="0" y1="0" x2="50" y2="-45" stroke="url(#gaugeNeedle)" stroke-width="3" stroke-linecap="round" />
    <circle cx="0" cy="0" r="8" fill="#ff3157" />
    <text x="0" y="35" text-anchor="middle" class="accent-text" font-size="18">8,500 <tspan font-size="11" fill="#a0aec0">RPM</tspan></text>
  </g>

  <!-- Right Side: Digital Telemetry Gauge (Ready for Launch) -->
  <g transform="translate(1440, 720)">
    <circle cx="0" cy="0" r="90" class="digital-gauge" stroke-dasharray="8 6" />
    <circle cx="0" cy="0" r="70" stroke="#ff3157" stroke-width="1.5" fill="none" opacity="0.5" />
    <text x="0" y="-10" text-anchor="middle" class="accent-text" font-size="12">MOTODC ID</text>
    <text x="0" y="14" text-anchor="middle" fill="#ffffff" font-size="16" font-family="'Sora', sans-serif" font-weight="700">AUTHENTICATED</text>
    <text x="0" y="34" text-anchor="middle" class="muted-text">SYS.READY // 100%</text>
  </g>

  <!-- Steering Wheel Arch Silhouette (Bottom Center) -->
  <path d="M 680 1080 C 680 920 1240 920 1240 1080 Z" fill="#080a0f" stroke="#ff3157" stroke-width="1.5" opacity="0.4" />
</svg>
