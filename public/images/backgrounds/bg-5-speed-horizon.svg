<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="horizonGlow" cx="50%" cy="48%" r="45%">
      <stop offset="0%" stop-color="#24101e" />
      <stop offset="50%" stop-color="#0b0e14" />
      <stop offset="100%" stop-color="#040608" />
    </radialGradient>
    <linearGradient id="redStreakGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 49, 87, 0.95)" />
      <stop offset="70%" stop-color="rgba(255, 49, 87, 0.4)" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>
    <linearGradient id="whiteStreakGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.85)" />
      <stop offset="70%" stop-color="rgba(200, 220, 255, 0.3)" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>
    <filter id="horizonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Night Sky & Horizon Vignette -->
  <rect width="1920" height="1080" fill="url(#horizonGlow)" />

  <!-- Distant Mountain / Bridge Horizon Silhouette -->
  <path d="M 0 520 Q 350 510 650 490 T 960 480 T 1320 495 T 1920 520 L 1920 1080 L 0 1080 Z" fill="#07090e" />

  <!-- Highway Asphalt Floor -->
  <path d="M 0 1080 L 760 520 L 1160 520 L 1920 1080 Z" fill="#0b0e16" />

  <!-- Road Center Dashes -->
  <g opacity="0.6">
    <polygon points="958,520 962,520 964,550 956,550" fill="#ff3157" />
    <polygon points="956,570 964,570 967,620 953,620" fill="#ffffff" />
    <polygon points="952,650 968,650 972,730 948,730" fill="#ff3157" />
    <polygon points="946,780 974,780 980,900 940,900" fill="#ffffff" />
    <polygon points="936,960 984,960 994,1080 926,1080" fill="#ff3157" />
  </g>

  <!-- Left Guardrail & Light Streaks (Cool White Headlights) -->
  <g filter="url(#horizonBlur)">
    <path d="M 820 525 Q 550 700 0 880" stroke="url(#whiteStreakGrad)" stroke-width="6" fill="none" opacity="0.7" />
    <path d="M 850 530 Q 600 730 50 950" stroke="url(#whiteStreakGrad)" stroke-width="4" fill="none" opacity="0.5" />
    <path d="M 880 535 Q 650 760 120 1040" stroke="url(#whiteStreakGrad)" stroke-width="2.5" fill="none" opacity="0.4" />
  </g>

  <!-- Right Side Red Taillight Streaks (Intense Crimson Motion Trails) -->
  <g filter="url(#horizonBlur)">
    <!-- Primary Red Beam -->
    <path d="M 1100 525 Q 1380 710 1920 890" stroke="url(#redStreakGrad)" stroke-width="9" fill="none" />
    <path d="M 1080 530 Q 1340 735 1860 970" stroke="url(#redStreakGrad)" stroke-width="5" fill="none" opacity="0.85" />
    <path d="M 1050 535 Q 1280 770 1740 1060" stroke="url(#redStreakGrad)" stroke-width="3" fill="none" opacity="0.6" />
    <path d="M 1120 522 Q 1420 690 1920 820" stroke="rgba(255, 120, 150, 0.9)" stroke-width="3" fill="none" />
  </g>

  <!-- Horizon Vanishing Point Flare -->
  <ellipse cx="960" cy="520" rx="120" ry="20" fill="rgba(255, 49, 87, 0.4)" filter="url(#horizonBlur)" />
  <circle cx="960" cy="520" r="15" fill="#ffffff" opacity="0.6" filter="url(#horizonBlur)" />

  <!-- Road Speed Label -->
  <text x="960" y="470" text-anchor="middle" fill="#ff3157" font-size="11" font-family="'Sora', sans-serif" font-weight="700" letter-spacing="4" opacity="0.65">NIGHT HORIZON // SPEED MATRIX</text>
</svg>
