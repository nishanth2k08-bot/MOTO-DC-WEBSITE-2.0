<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="garageAmbient" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#19131a" />
      <stop offset="50%" stop-color="#090b10" />
      <stop offset="100%" stop-color="#040508" />
    </radialGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="50%" stop-color="#121620" />
      <stop offset="100%" stop-color="#06080c" />
    </linearGradient>
    <linearGradient id="overheadLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="rgba(255,255,255,0.8)" />
      <stop offset="100%" stop-color="rgba(255, 49, 87, 0)" />
    </linearGradient>
    <linearGradient id="redCeilingStrip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff3157" />
      <stop offset="100%" stop-color="rgba(255, 49, 87, 0)" />
    </linearGradient>
    <radialGradient id="floorSpotlight" cx="50%" cy="65%" r="45%">
      <stop offset="0%" stop-color="rgba(255, 49, 87, 0.16)" />
      <stop offset="60%" stop-color="rgba(255, 49, 87, 0.03)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
    <filter id="lightGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <rect width="1920" height="1080" fill="url(#garageAmbient)" />

  <!-- Garage Back Wall Partition -->
  <rect x="0" y="0" width="1920" height="480" fill="#07090e" opacity="0.9" />
  <line x1="0" y1="480" x2="1920" y2="480" stroke="#1f2533" stroke-width="2" />

  <!-- Polished Epoxy Floor with Reflections -->
  <rect x="0" y="480" width="1920" height="600" fill="url(#floorGrad)" />
  <rect x="0" y="480" width="1920" height="600" fill="url(#floorSpotlight)" />

  <!-- Floor Perspective Grid -->
  <g opacity="0.25">
    <line x1="960" y1="480" x2="0" y2="1080" stroke="#ff3157" stroke-width="1.2" />
    <line x1="960" y1="480" x2="380" y2="1080" stroke="#ffffff" stroke-width="0.8" />
    <line x1="960" y1="480" x2="720" y2="1080" stroke="#ffffff" stroke-width="0.8" />
    <line x1="960" y1="480" x2="960" y2="1080" stroke="#ff3157" stroke-width="1.5" />
    <line x1="960" y1="480" x2="1200" y2="1080" stroke="#ffffff" stroke-width="0.8" />
    <line x1="960" y1="480" x2="1540" y2="1080" stroke="#ffffff" stroke-width="0.8" />
    <line x1="960" y1="480" x2="1920" y2="1080" stroke="#ff3157" stroke-width="1.2" />
    
    <!-- Transverse Floor Expansion Joints -->
    <line x1="180" y1="560" x2="1740" y2="560" stroke="#ffffff" stroke-width="0.6" />
    <line x1="100" y1="670" x2="1820" y2="670" stroke="#ffffff" stroke-width="0.7" />
    <line x1="0" y1="830" x2="1920" y2="830" stroke="#ffffff" stroke-width="0.9" />
  </g>

  <!-- Overhead Architecture: Industrial LED Light Bars -->
  <g filter="url(#lightGlow)">
    <!-- Center Red Light Strip -->
    <rect x="945" y="0" width="30" height="380" rx="6" fill="url(#redCeilingStrip)" />
    <!-- Flanking Cool White Tubes -->
    <rect x="520" y="0" width="18" height="320" rx="4" fill="url(#overheadLight)" opacity="0.6" />
    <rect x="1382" y="0" width="18" height="320" rx="4" fill="url(#overheadLight)" opacity="0.6" />
    <!-- Outer Accent Bars -->
    <rect x="180" y="0" width="12" height="260" rx="3" fill="url(#overheadLight)" opacity="0.35" />
    <rect x="1728" y="0" width="12" height="260" rx="3" fill="url(#overheadLight)" opacity="0.35" />
  </g>

  <!-- Floor Reflections of Overhead Lights -->
  <g opacity="0.4" filter="url(#lightGlow)">
    <ellipse cx="960" cy="580" rx="40" ry="80" fill="rgba(255, 49, 87, 0.4)" />
    <ellipse cx="529" cy="540" rx="20" ry="50" fill="rgba(255, 255, 255, 0.25)" />
    <ellipse cx="1391" cy="540" rx="20" ry="50" fill="rgba(255, 255, 255, 0.25)" />
  </g>

  <!-- Background Tool Chest & Tire Silhouette Silhouette Details -->
  <g opacity="0.35">
    <!-- Left Tool Chest Cabinet -->
    <rect x="220" y="320" width="220" height="160" rx="6" fill="#131722" stroke="#252c3d" stroke-width="1.5" />
    <line x1="220" y1="360" x2="440" y2="360" stroke="#252c3d" stroke-width="1" />
    <line x1="220" y1="400" x2="440" y2="400" stroke="#252c3d" stroke-width="1" />
    <line x1="220" y1="440" x2="440" y2="440" stroke="#252c3d" stroke-width="1" />
    <!-- Right Tire Rack Stack -->
    <rect x="1500" y="240" width="180" height="240" rx="4" fill="#0d1017" stroke="#1f2533" stroke-width="1.5" />
    <ellipse cx="1590" cy="300" rx="60" ry="24" fill="#181e2b" stroke="#2a3346" stroke-width="2" />
    <ellipse cx="1590" cy="360" rx="60" ry="24" fill="#181e2b" stroke="#2a3346" stroke-width="2" />
    <ellipse cx="1590" cy="420" rx="60" ry="24" fill="#181e2b" stroke="#2a3346" stroke-width="2" />
  </g>

  <!-- Workshop Tech Badge -->
  <text x="960" y="450" text-anchor="middle" fill="#4a5568" font-size="12" font-family="'Sora', sans-serif" font-weight="700" letter-spacing="4" opacity="0.6">MOTODC PERFORMANCE ATELIER // BAY 01</text>
</svg>
